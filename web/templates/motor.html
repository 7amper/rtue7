<!DOCTYPE html>
<html>
<head>
    <title>Motor Control</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <p><a href="/motor">Motor Control</a> | <a href="/registers">Registers</a> | <a href="/assun">ASSUN</a>| <a href="/config">Configuration</a>
       <button type="button" onclick="stopAllMotors()" title="Stop all 4 drives (write Stop to the Start Type register of every axis)">Stop All</button>
       <span id="stopMsg" style="color:#555;"></span></p>
        <h1>Motor Control (Modbus RTU)</h1>
        <form action="/motor" method="post">
            <label>Axis:
                <select name="axis" onchange="this.form.submit()"> 
                    <option value="x" {{if eq .SelAxis "x"}}selected{{end}}>Axis X (slave {{.Motors.AxisX}})</option>
                    <option value="y" {{if eq .SelAxis "y"}}selected{{end}}>Axis Y (slave {{.Motors.AxisY}})</option>
                    <option value="z" {{if eq .SelAxis "z"}}selected{{end}}>Axis Z (slave {{.Motors.AxisZ}})</option>
                    <option value="a" {{if eq .SelAxis "a"}}selected{{end}}>Axis A (slave {{.Motors.AxisA}})</option>
                </select>
            </label>
            <label>Speed (0-1000): <input type="number" name="setspeed" value={{.speedH}} step="any" placeholder="0.0"></label>
            <label>Step: <input type="number" name="setpos" value={{.stepH}} step="any" placeholder="0.0"></label>
            <div>
                <button type="submit" name="direction" value="backward">Backward continuous</button>
                <button type="submit" name="direction" value="backwardstep">Backward step </button>
                <button type="submit" name="direction" value="stop">Stop</button>
                <button type="submit" name="direction" value="forwardstep">Forward step </button>
                <button type="submit" name="direction" value="forward">Forward continuous</button>
            </div>
        </form>
        {{if .error}}<div class="error">Error: {{.message}}</div>{{end}}
        {{if .ok}}<div class="ok">{{.message}}</div>{{end}}
    <script>
    function stopAllMotors() {
        var msg = document.getElementById('stopMsg');
        msg.textContent = 'Stopping all drives...';
        fetch('/api/stopall', { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j.error) { msg.textContent = 'Stop All error: ' + j.error; return; }
                var parts = (j.results || []).map(function (x) {
                    return 'axis ' + x.axis + ' (slave ' + x.slave + '): ' + (x.ok ? 'stopped' : 'FAILED (' + x.error + ')');
                });
                msg.textContent = 'Stop All: ' + (parts.length ? parts.join('; ') : 'no axes configured');
            })
            .catch(function (e) { msg.textContent = 'Stop All request failed: ' + e; });
    }
    </script>
</body>
</html>
