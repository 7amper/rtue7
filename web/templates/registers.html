<!DOCTYPE html>
<html>
<head>
    <title>Modbus Registers</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!--<div class="container">-->
    <p><a href="/motor">Motor Control</a> | <a href="/registers">Registers</a> | <a href="/video">Video</a>| <a href="/config">Configuration</a> </p>
       <h1>Read/Write Modbus Registers</h1>
        <form method="post">
            <label>Slave ID: <input type="number" name="slave_id" value="1"></label>
            <label>Type: 
                <select name="reg_type">
                    <option value="holding">Holding Register</option>
                </select>
            </label>
            <label>Address (0..65535): <input type="number" name="address" value="4096"></label>
            <label>Value: <input type="number" name="value" value={{.result}}></label>
            <div>
                <button type="submit" name="action" value="read">Read</button>
                <button type="submit" name="action" value="write">Write</button>
            </div>
        </form>
        {{if .result}}<div class="result">Read result: {{.result}}</div>{{end}}
        {{if .ok}}<div class="ok">Write completed</div>{{end}}
    <!--</div>-->
</body>
</html>
